<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snake</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    #hud {
      width: 800px;
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }
    canvas {
      background: #000;
      border: 2px solid #fff;
      image-rendering: pixelated;
    }
    #hint { font-size: 0.8rem; opacity: 0.7; }
  </style>
</head>
<body>
  <h1 id="title">Snake</h1>
  <div id="hud">
    <span>Score: <span id="score">0</span></span>
    <span>Best: <span id="best">0</span></span>
  </div>
  <canvas id="game" width="800" height="800"></canvas>
  <div id="hint">Arrow keys to move · Space to restart</div>

  <script>
    const COLS = 20;
    const ROWS = 20;
    const TICK_MS = 120;

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const cell = canvas.width / COLS;
    document.getElementById("title").textContent =
      `Snake ${canvas.width}×${canvas.height}`;

    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");

    const DIRS = {
      ArrowUp:    { x: 0,  y: -1 },
      ArrowDown:  { x: 0,  y:  1 },
      ArrowLeft:  { x: -1, y:  0 },
      ArrowRight: { x: 1,  y:  0 },
    };

    let snake, dir, pendingDir, food, score, best, alive, lastTick, raf;

    function same(a, b) {
      return a.x === b.x && a.y === b.y;
    }

    function occupied(pos) {
      return snake.some((seg) => same(seg, pos));
    }

    function randomFoodColor() {
      const h = Math.floor(Math.random() * 360);
      const s = 70 + Math.floor(Math.random() * 30);
      const l = 45 + Math.floor(Math.random() * 25);
      return `hsl(${h} ${s}% ${l}%)`;
    }

    function placeFood() {
      const empty = [];
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (!occupied({ x, y })) empty.push({ x, y });
        }
      }
      const spot = empty[Math.floor(Math.random() * empty.length)];
      food = spot ? { x: spot.x, y: spot.y, color: randomFoodColor() } : null;
    }

    function reset() {
      const midX = Math.floor(COLS / 2);
      const midY = Math.floor(ROWS / 2);
      snake = [
        { x: midX, y: midY },
        { x: midX - 1, y: midY },
        { x: midX - 2, y: midY },
      ];
      dir = DIRS.ArrowRight;
      pendingDir = dir;
      score = 0;
      alive = true;
      lastTick = 0;
      scoreEl.textContent = "0";
      placeFood();
    }

    function opposite(a, b) {
      return a.x + b.x === 0 && a.y + b.y === 0;
    }

    function step() {
      dir = pendingDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      const hitWall = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
      const hitSelf = occupied(head);
      if (hitWall || hitSelf) {
        alive = false;
        return;
      }

      snake.unshift(head);
      if (food && same(head, food)) {
        score += 1;
        scoreEl.textContent = String(score);
        if (score > best) {
          best = score;
          bestEl.textContent = String(best);
          localStorage.setItem("snake-best", String(best));
        }
        placeFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#fff";
      for (const seg of snake) {
        ctx.fillRect(seg.x * cell, seg.y * cell, cell - 1, cell - 1);
      }

      if (food) {
        ctx.fillStyle = food.color;
        ctx.fillRect(food.x * cell + 6, food.y * cell + 6, cell - 13, cell - 13);
      }

      if (!alive) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "36px ui-monospace, Consolas, monospace";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 12);
        ctx.font = "18px ui-monospace, Consolas, monospace";
        ctx.fillText("Press Space to restart", canvas.width / 2, canvas.height / 2 + 24);
      }
    }

    function loop(t) {
      if (alive && t - lastTick >= TICK_MS) {
        lastTick = t;
        step();
      }
      draw();
      raf = requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === " " && !alive) {
        e.preventDefault();
        reset();
        return;
      }
      const next = DIRS[e.key];
      if (!next) return;
      e.preventDefault();
      if (!opposite(next, dir) && !opposite(next, pendingDir)) pendingDir = next;
    });

    best = Number(localStorage.getItem("snake-best") || 0);
    bestEl.textContent = String(best);
    reset();
    raf = requestAnimationFrame(loop);
  </script>
</body>
</html>
